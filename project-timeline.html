║   機率部門專案時程管理儀表板                                      ║

║   A:機台名稱 B:階段名稱 C:計畫開始日 D:計畫結束日               ║
║   E:實際開始日 F:實際結束日 G:負責人 H:備註 I:優先級             ║

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機率部門專案時程管理儀表板</title>
<script>(function(){try{var p=localStorage.getItem('theme');var d=p!=='light'&&(p!=='auto'||matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}})()</script>
<style>
:root{color-scheme:light;
  --bg:#f8f9fa;--surface:#fff;--surface-2:#fafafa;--surface-3:#f1f1f1;--surface-tint:#f3f0ff;
  --line:#eee;--line-2:#eceef2;--line-soft:#f5f5f5;--line-faint:#f0f0f0;--line-card:#f2f2f2;--line-row:#f8f8f8;--line-strong:#ddd;--month-bg:#f7f8fa;--month-alt:#f3f4f8;--month-alt-cell:rgba(16,24,40,.035);
  --ink:#1a1a2e;--ink-2:#4a5160;--ink-3:#68707f;--text:#333;--ink-muted:#666;--ink-mid:#555;--ink-soft:#667085;--on-accent:#fff;--tip-bg:#1a1a2e;--tip-ink:#fff;
  --accent:#4f46e5;--accent-tint:#ecedfb;--plan:#6366f1;
  --good-ink:#047857;--good-text:#15803d;--good-bg:#d1fae5;--good-mark:#22c55e;
  --warn-ink:#754d00;--warn-bg:#fbefd6;--warn-mark:#eab308;--warn-text:#9a6206;--warn-ring:#b45309;
  --crit-ink:#b3211f;--crit-bg:#fde5e4;--crit-mark:#ef4444;--crit-line:#fecaca;--late-bg:#fdf3f2;
  --info-ink:#0369a1;--info-bg:#e0f2fe;--err-text:#dc2626;--err-bg:#fef2f2;
  --shadow-sm:0 1px 3px rgba(16,24,40,.05);
  --shadow-md:0 2px 8px rgba(0,0,0,.05);--shadow-lg:0 16px 48px rgba(0,0,0,.15);
  --shadow-toast:0 6px 20px rgba(0,0,0,.22);--ring:rgba(16,24,40,.15);--backdrop:rgba(0,0,0,.35)}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#0d0f13;--surface:#161a21;--surface-2:#1d222b;--surface-3:#242a34;--surface-tint:#23233d;
  --line:#262b34;--line-2:#2a3039;--line-soft:#1f242d;--line-faint:#22272f;--line-card:#20252e;--line-row:#1a1f27;--line-strong:#39404c;--month-bg:#1a1f27;--month-alt:#1e232c;--month-alt-cell:rgba(255,255,255,.045);
  --ink:#f0f2f6;--ink-2:#b2bac7;--ink-3:#8d96a5;--text:#dfe4ec;--ink-muted:#9aa3b2;--ink-mid:#a9b1be;--ink-soft:#98a2b3;--on-accent:#0f1117;--tip-bg:#e9ecf2;--tip-ink:#14161c;
  --accent:#8f8ffa;--accent-tint:#262a4a;--plan:#8b8df5;
  --good-ink:#5ed88a;--good-text:#6fdc95;--good-bg:#12362a;--good-mark:#34d17a;
  --warn-ink:#f3bb46;--warn-bg:#3b2e12;--warn-mark:#e5b62a;--warn-text:#f0b94a;--warn-ring:#f59e0b;
  --crit-ink:#fb8380;--crit-bg:#3d1c1c;--crit-mark:#f26b6b;--crit-line:#5a2a2a;--late-bg:#271a1d;
  --info-ink:#6fc3f2;--info-bg:#12303f;--err-text:#fb8380;--err-bg:#331a1a;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 2px 8px rgba(0,0,0,.35);--shadow-lg:0 16px 48px rgba(0,0,0,.6);
  --shadow-toast:0 6px 20px rgba(0,0,0,.6);--ring:rgba(255,255,255,.16);--backdrop:rgba(0,0,0,.6)}

*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line-strong) transparent;accent-color:var(--accent)}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
/* 版面：左側固定欄＋主區（參考 Linear／Asana 的側欄） */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;background:var(--surface-2);border-right:1px solid var(--line)}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.side-brand .brand-mark{width:34px;height:34px;border-radius:9px;font-size:18px}
.side-name{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.side-name b{font-size:15px;color:var(--ink)}
.side-name small{font-size:12px;color:var(--ink-2)}
.side-links{margin-top:18px;min-width:0}
.side-grp{display:flex;align-items:center;justify-content:space-between;padding:0 8px 4px}
.side-grp h2{font-size:12px;font-weight:700;color:var(--ink-3)}
.side-edit{background:none;border:0;font:inherit;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:2px 6px;border-radius:5px}
.side-edit:hover{color:var(--ink);background:var(--surface-3)}
.side-list{list-style:none}
.side-link{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border-radius:7px;font-size:13px;color:var(--ink-2);text-decoration:none}
.side-link:hover{background:var(--surface-3);color:var(--ink)}
.side-link .ic{color:var(--ink-3)}
.side-link .lt-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-link .link-intra{margin-left:auto}
.side-empty{font-size:12px;color:var(--ink-3);padding:4px 8px}
.side-foot{margin-top:auto;padding:14px 6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.side-status{display:flex;flex-direction:column;font-size:12px;color:var(--ink-2);line-height:1.45;font-variant-numeric:tabular-nums}
.side-status #gen-time{color:var(--ink-3)}
.side-tools{display:flex;gap:8px}
.main-col{min-width:0;padding:24px}
.page-hd h1{font-size:22px;color:var(--ink);font-weight:700;line-height:1.25}
.stat-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat-pill{display:inline-flex;align-items:baseline;gap:8px;padding:7px 12px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow-sm);font-size:13px;color:var(--ink-2);white-space:nowrap}
.stat-pill b{font-size:17px;font-weight:700;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-pill.crit{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit-ink)}.stat-pill.crit b{color:var(--crit-ink)}
.stat-pill.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}.stat-pill.warn b{color:var(--warn-ink)}
.brand-mark{flex-shrink:0;display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-size:22px;font-weight:800;line-height:1}
.btn-gear{display:inline-grid;place-items:center;padding:0;background:none;border:1px solid var(--line-strong);border-radius:8px;width:36px;height:36px;cursor:pointer;color:var(--ink-muted)}
.btn-gear:hover{background:var(--surface-tint);border-color:var(--plan);color:var(--plan)}
.btn-theme{height:36px;padding:0 10px;background:none;border:1px solid var(--line-strong);border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.btn-theme:hover{background:var(--surface-tint);border-color:var(--plan);color:var(--plan)}
.error-banner{background:var(--err-bg);border:1px solid var(--crit-line);border-radius:8px;padding:12px 16px;margin-bottom:16px;color:var(--err-text);font-size:13px;display:none}
.loading{text-align:center;padding:40px;color:var(--ink-2)}
.loading::after{content:'';display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--plan);border-radius:50%;animation:spin .7s linear infinite;margin-left:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.section{background:var(--surface);border-radius:10px;padding:20px;margin-top:20px;box-shadow:var(--shadow-md)}
.section-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-hdr h2{font-size:16px;color:var(--ink);font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:13px;background:var(--surface)}
.toolbar input{width:160px}
.as-btn{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;line-height:inherit;color:inherit;text-align:left;cursor:pointer}
.btn{padding:7px 14px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer}
.btn{transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:active,.btn-icon:active,.btn-launch:active,.btn-gear:active,.btn-theme:active{transform:translateY(1px)}
.btn-ghost{background:none;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn-ghost:hover{opacity:1;background:var(--surface-2);color:var(--ink)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-edit{background:var(--info-bg);color:var(--info-ink)}
.btn-delete{background:var(--crit-bg);color:var(--crit-ink)}
.btn-add-stage{background:var(--good-bg);color:var(--good-ink)}
.mach-panel{container-type:inline-size}
.machine-group{border-top:1px solid var(--line);overflow:clip}
#table-area>.machine-group:last-child{border-bottom:1px solid var(--line)}
/* 欄寬：機台名稱拿剩下的空間，其餘欄依內容給固定或小範圍寬度，避免名稱被擠到只剩幾個字 */
.machine-header,.mach-colhdr{display:grid;grid-template-columns:12px minmax(112px,1fr) 32px minmax(44px,60px) minmax(64px,112px) minmax(92px,124px) 80px 48px max-content;align-items:center;gap:8px}
.machine-header{padding:12px;background:transparent;cursor:pointer;user-select:none}
.machine-header:hover{background:var(--surface-tint)}
.mach-colhdr{padding:0 12px 8px;font-size:11px;font-weight:600;color:var(--ink-3);white-space:nowrap}
@supports (grid-template-columns:subgrid){
  /* 所有機台列共用同一組欄寬；內容較寬的列（例如已上線）不再把欄位推開 */
  #table-area{display:grid;grid-template-columns:auto minmax(112px,1fr) 32px minmax(44px,60px) minmax(64px,112px) minmax(92px,124px) 80px 48px max-content;column-gap:8px}
  #table-area>*{grid-column:1/-1}
  .machine-group{display:grid;grid-template-columns:subgrid;gap:normal}
  .machine-header,.mach-colhdr{grid-column:1/-1;grid-template-columns:subgrid;gap:normal}
  .stage-table{grid-column:1/-1}
}
.machine-name{font-weight:600;font-size:14px;color:var(--ink)}
.machine-header .machine-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.machine-group.is-late>.machine-header{background:var(--late-bg)}
.machine-group.is-late>.machine-header:hover,.machine-group.is-late>.machine-header:focus-within{background:var(--surface-tint)}
.health{width:10px;height:10px;border-radius:50%;justify-self:center;background:var(--good-mark);box-shadow:0 0 0 3px color-mix(in srgb,var(--good-mark) 16%,transparent)}
.health-yellow{background:var(--warn-mark);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn-mark) 20%,transparent)}
.health-red{background:var(--crit-mark);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit-mark) 20%,transparent)}
.health-done{background:transparent;box-shadow:inset 0 0 0 2px var(--ink-3)}
.mach-upd{font-size:11px;text-align:right;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.mach-upd.is-stale{color:var(--warn-text);font-weight:600}
.mach-colhdr .upd-h{text-align:right}
.upd-pfx{display:none}
.badge-muted{background:var(--surface-3);color:var(--ink-2)}
.ic{flex-shrink:0;display:inline-block;vertical-align:-.125em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ms-mark{display:inline-block;margin-right:5px;color:var(--plan);vertical-align:middle;line-height:0}
.btn-icon{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:6px;background:none;color:var(--ink-3);cursor:pointer;transition:background-color .15s,color .15s}
.btn-icon:hover{background:var(--surface-3);color:var(--ink)}
.btn-icon-danger:hover{background:var(--crit-bg);color:var(--crit-ink)}
.btn-launch{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px;border:1px solid color-mix(in srgb,var(--good-ink) 35%,transparent);border-radius:6px;background:none;color:var(--good-ink);font:inherit;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background-color .15s}
.btn-launch:hover{background:var(--good-bg)}
.machine-meta{font-size:12px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.machine-actions{display:flex;gap:2px;align-items:center}
.progress-bar{width:80px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px}
.stage-table{width:100%;border-collapse:collapse;display:none;background:var(--surface-2)}
.stage-table.open{display:table}
.stage-table th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.stage-table td{padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;font-variant-numeric:tabular-nums}
.stage-table td:nth-child(-n+3){white-space:nowrap}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--good-bg);color:var(--good-ink)}
.badge-yellow{background:var(--warn-bg);color:var(--warn-ink)}
.badge-red{background:var(--crit-bg);color:var(--crit-ink)}
.priority-高{background:var(--crit-bg);color:var(--crit-ink)}
.priority-中{background:var(--warn-bg);color:var(--warn-ink)}
.priority-低{background:var(--surface-3);color:var(--ink-2)}
.gantt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gantt{position:relative}
.gantt-hdr{display:flex;border-bottom:2px solid var(--line)}
.gantt-lbl{width:180px;min-width:180px;padding:6px 10px;font-size:11px;color:var(--ink-2);position:sticky;left:0;z-index:16;background:var(--surface);border-right:1px solid var(--line-2)}
.gantt-timeline{display:flex;flex:1}
.gantt-wk{flex:0 0 var(--wk,60px);text-align:center;padding:4px 2px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-3);border-left:1px solid var(--line-faint)}
.gantt-mhdr{display:flex}
.gantt-mhdr-lbl{width:180px;min-width:180px;position:sticky;left:0;z-index:16;background:var(--surface);border-right:1px solid var(--line-2)}
.gantt-month{text-align:center;font-size:11px;font-weight:600;color:var(--ink-soft);padding:5px 0;border-left:1px solid var(--line-2);background:var(--month-bg)}
.gantt-group-label{padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink);background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;left:0;z-index:12}
.gantt-row{display:flex;border-bottom:1px solid var(--line-row);min-height:28px;align-items:center}
.gantt-row:hover{background:var(--surface-2)}
.gantt-row:hover .gantt-row-lbl{background:var(--surface-2)}
.gantt-row-lbl{width:180px;min-width:180px;padding:4px 10px 4px 24px;font-size:12px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;z-index:12;background:var(--surface);border-right:1px solid var(--line-2)}
.gantt-row-tl{display:flex;flex:1;position:relative;height:28px}
.gantt-cell{flex:0 0 var(--wk,60px);border-left:1px solid var(--surface-2)}
.g-plan{position:absolute;top:4px;height:8px;border-radius:4px;opacity:.4}
.g-actual{position:absolute;top:14px;height:10px;border-radius:4px}
.g-milestone{position:absolute;top:6px;width:12px;height:12px;transform:rotate(45deg);border:2px solid}
.today-line{position:absolute;top:17px;bottom:0;width:2px;background:var(--crit-mark);opacity:.7;z-index:10;pointer-events:none}
.today-label{position:absolute;top:-17px;left:1px;height:16px;line-height:14px;font-size:11px;font-weight:600;color:var(--crit-ink);background:var(--crit-bg);border:1px solid var(--crit-mark);padding:0 6px;border-radius:8px;transform:translateX(-50%);white-space:nowrap}
.gantt-today-lane{height:17px;font-size:11px;line-height:15px;color:var(--ink-3);padding:1px 10px;white-space:nowrap;overflow:hidden}
.gantt-month.alt{background:var(--month-alt)}.gantt-cell.alt{background:var(--month-alt-cell)}
.g-dot .ms-label-l{left:auto;right:16px}
.g-edge{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap;pointer-events:none;z-index:4}.g-edge-l{left:4px}.g-edge-r{right:4px}.g-edge-b{top:auto;bottom:0;transform:none}
.gantt-sep{width:1px;align-self:stretch;background:var(--line-strong);margin:0 4px}
.gantt-toggle{display:flex;gap:4px}
.gantt-toggle .btn-sm{background:var(--surface-3);color:var(--ink-muted)}
.gantt-toggle .btn-sm.active{background:var(--accent);color:var(--on-accent)}
.g-bar{position:absolute;top:8px;height:12px;border-radius:6px;opacity:.25}
.gantt-row.ms-row{min-height:38px}
.ms-row .gantt-row-tl{height:38px}
.ms-row .g-bar{top:17px;height:4px;border-radius:2px}
.g-dot{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);cursor:pointer;transform:translateX(-7px);z-index:5;box-shadow:0 0 0 1px var(--ring)}
.g-dot .ms-label{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap;pointer-events:none;background:var(--surface);padding:0 3px;border-radius:3px}
.g-dot-green{background:var(--good-mark)}.g-dot-yellow{background:var(--warn-mark)}.g-dot-red{background:var(--crit-mark)}.g-dot-done{background:var(--surface);border-color:var(--ink-3)}
.g-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-ink);padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;pointer-events:none;display:none;z-index:20}
.g-dot:hover .g-tooltip,.g-dot:focus .g-tooltip{display:block}
.gantt-row-tl{overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--ink-muted)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-plan{width:16px;height:6px;border-radius:3px;background:var(--plan);opacity:.4}
.legend-actual{width:16px;height:8px;border-radius:3px;background:var(--plan)}
.legend-ms{width:8px;height:8px;transform:rotate(45deg);border:2px solid var(--plan);background:var(--surface)}
.legend-today{width:16px;height:2px;background:var(--crit-mark)}
.legend-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px var(--ring)}
.legend-dot.done{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink-3)}
.legend[data-view=milestone] .lg-detail,.legend[data-view=detail] .lg-ms{display:none}
.tab-nav{display:flex;flex-direction:column;gap:2px}
.tab-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;font:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink-2);transition:background-color .15s}
.tab-btn:hover{color:var(--ink);background:var(--surface-3)}
.tab-btn.active{color:var(--accent);background:var(--accent-tint)}
.tab-content{display:none}.tab-content.active{display:block}.tab-content[hidden]{display:none}
.ab-table{width:100%;border-collapse:collapse;font-size:13px}
.ab-table th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-strong);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.ab-table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.ab-table tr:hover{background:var(--surface-2)}
.ab-winner{background:var(--good-bg);color:var(--good-ink);font-weight:700;border-radius:4px;padding:2px 6px}
.ab-version{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;margin:2px;border:2px solid transparent;white-space:nowrap;font-variant-numeric:tabular-nums}
.ab-version.winner{border-color:var(--warn-ring);box-shadow:0 0 0 2px var(--surface),0 0 0 4px rgba(180,83,9,.5)}
.link-intra{flex-shrink:0;font-size:11px;font-weight:700;line-height:16px;padding:0 5px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink)}
.ab-legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-2)}
.ab-legend-item{display:inline-flex;align-items:center;gap:6px}
.ab-legend-chip{cursor:default;margin:0;background:var(--surface);color:var(--ink-mid);border:2px solid var(--line-strong)}
.ab-legend-chip.is-running{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-mark)}
.ab-timeline-row{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}
.ab-timeline-row:hover,.ab-timeline-row:hover .ab-timeline-lbl{background:var(--surface-2)}
/* 名稱欄在左右捲動時固定在左邊，跟甘特圖一樣 */
.ab-timeline-lbl{width:160px;min-width:160px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);padding:0 10px;position:sticky;left:0;z-index:11;background:var(--surface);border-right:1px solid var(--line-2)}
.ab-tl-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ab-timeline{--ab-lbl-w:160px;--ab-note-w:92px;min-width:calc(var(--ab-lbl-w) + var(--ab-note-w) + var(--ab-wks,0) * 44px)}
.ab-tl-hdr{display:flex;border-bottom:1px solid var(--line-strong)}
.ab-tl-hlbl{width:var(--ab-lbl-w);min-width:var(--ab-lbl-w);padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink-2);position:sticky;left:0;z-index:11;background:var(--surface);border-right:1px solid var(--line-2)}
.ab-tl-wks{display:flex;flex:1;min-width:0}
.ab-wk{flex:1 1 0;min-width:0;overflow:hidden;text-align:center;padding:4px 2px;font-size:11px;color:var(--ink-3);border-left:1px solid var(--line-faint);font-variant-numeric:tabular-nums}
.ab-timeline-bar{flex:1;position:relative;height:44px}
.ab-note{width:var(--ab-note-w);min-width:var(--ab-note-w);max-width:var(--ab-note-w);flex:0 0 var(--ab-note-w);box-sizing:border-box;text-align:right;padding:0 8px 0 4px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-dot.cmp{outline:2px dashed var(--warn-ring);outline-offset:2px}
.ab-dot{position:absolute;top:1px;width:20px;height:20px;border-radius:50%;transform:translateX(-10px);cursor:default;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--surface),0 1px 3px rgba(0,0,0,.2);z-index:5}
.ab-dot.lane1{top:23px}
.ab-dot.winner{width:24px;height:24px;top:-1px;transform:translateX(-12px);box-shadow:0 0 0 2px var(--surface),0 0 0 4px rgba(251,191,36,.6),0 2px 4px rgba(0,0,0,.2)}
.ab-dot.winner.lane1{top:21px}
.ab-gap{display:block;font-size:11px;font-weight:600;color:var(--warn-text);line-height:1.3;margin-top:1px;white-space:normal;max-width:150px}
.ab-dot-tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-ink);padding:3px 6px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.ab-dot:hover .ab-dot-tip,.ab-dot:focus .ab-dot-tip{opacity:1}
.ab-connect{position:absolute;top:20px;height:2px;background:var(--line-strong);z-index:1}
.ab-status-badge{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.ab-status-打磨中{background:var(--accent-tint);color:var(--accent)}
.ab-status-已定版{background:var(--surface-3);color:var(--ink-2)}
.footer{text-align:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--tip-bg);color:var(--tip-ink);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-toast);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
.toast-ok{border-left:4px solid var(--good-mark)}
.toast-err{border-left:4px solid var(--crit-mark)}
.modal::backdrop{background:var(--backdrop)}
.modal-sm{max-width:380px}
.modal-err{background:var(--crit-bg);color:var(--crit-ink);border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:12.5px;font-weight:600}
.modal{background:var(--surface);border:0;margin:auto;border-radius:12px;padding:24px;width:90%;max-width:480px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;overflow-x:visible}
.modal h3{font-size:16px;margin-bottom:16px;color:var(--ink)}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;color:var(--ink-muted);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:7px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:13px}
.fg textarea{height:50px;resize:vertical}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{background:var(--surface-3);color:var(--ink-muted)}
.settings-list{list-style:none;max-height:280px;overflow-y:auto}
.settings-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-faint)}
.settings-item input[type=text]{flex:1;padding:5px 8px;border:1px solid var(--line-strong);border-radius:4px;font-size:13px}
.settings-item input[type=color]{width:32px;height:28px;border:none;cursor:pointer;border-radius:4px}
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.machine-header:focus-within{background:var(--surface-tint)}
.skip-link{position:absolute;left:12px;top:-60px;z-index:3000;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none}
.skip-link:focus{top:12px}
#app:focus{outline:none}
@media(max-width:900px){.shell{display:block}.side{position:static;height:auto;overflow:visible;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand tools" "status status" "nav nav" "links links";gap:10px 12px;padding:14px 16px 0;background:none;border-right:0}.side-brand{grid-area:brand;padding:0}.side-foot{display:contents}.side-status{grid-area:status;flex-direction:row;flex-wrap:wrap;column-gap:8px}.side-tools{grid-area:tools;align-self:center}.tab-nav{grid-area:nav;flex-direction:row;gap:4px;border-bottom:1px solid var(--line-strong)}.tab-btn{flex:1;justify-content:center;padding:10px 8px;margin-bottom:-1px;border-radius:6px 6px 0 0;border-bottom:2px solid transparent}.tab-btn.active{background:none;border-bottom-color:var(--accent)}.side-links{grid-area:links;margin:0}.side-grp{padding:0 0 6px}.side-list{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}.side-list::-webkit-scrollbar{display:none}.side-link{flex:0 0 auto;max-width:220px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap}.side-link .link-intra{margin-left:0}.main-col{padding:16px}}
/* 640–757px：保留表格對齊，藏進度條、「確定上線」只留圖示（文字仍在 aria-label） */
@container (min-width:640px) and (max-width:757px){#table-area{grid-template-columns:auto minmax(104px,1fr) 32px minmax(40px,56px) minmax(60px,100px) minmax(88px,116px) 44px 48px max-content}.machine-header .progress-bar{display:none}.btn-launch{width:28px;padding:0;justify-content:center;border-color:transparent}.btn-launch .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
@container (max-width:639px){.mach-colhdr{display:none}.upd-pfx{display:inline}#table-area,.machine-group{display:block}.machine-header{grid-template-columns:auto minmax(0,auto) minmax(min-content,1fr) auto;grid-auto-rows:auto;column-gap:8px;row-gap:5px;align-items:center;padding:9px 12px}.machine-header>:nth-child(1){grid-column:1;grid-row:1}.machine-header>:nth-child(2){grid-column:2;grid-row:1;font-size:13px;max-width:52cqw}.machine-header>:nth-child(4){grid-column:3;grid-row:1;font-size:11px;justify-self:start!important}.machine-header>:nth-child(3){grid-column:4;grid-row:1;justify-self:end!important}.machine-header>:nth-child(5){grid-column:1/4;grid-row:2;justify-self:start!important}.machine-header>:nth-child(6){grid-column:4;grid-row:2;justify-self:end!important}.machine-header>:nth-child(7){grid-column:1/4;grid-row:3}.machine-header>:nth-child(8){grid-column:4;grid-row:3;justify-self:end;text-align:right}.machine-header>:nth-child(9){grid-column:1/-1;grid-row:4;justify-self:start!important;flex-wrap:wrap}}
@media(max-width:768px){.side{padding:12px 12px 0}.side-list{margin:0 -12px;padding:0 12px 2px}.main-col{padding:12px}.page-hd h1{font-size:18px}.section{padding:14px}.gantt-lbl,.gantt-row-lbl,.gantt-mhdr-lbl{width:120px;min-width:120px}.gantt-row-lbl{padding-left:14px}.mach-colhdr{display:none}.upd-pfx{display:inline}#table-area,.machine-group{display:block}.machine-header{grid-template-columns:auto minmax(0,auto) minmax(min-content,1fr) auto;grid-auto-rows:auto;column-gap:8px;row-gap:5px;align-items:center;padding:9px 12px}.machine-header>:nth-child(1){grid-column:1;grid-row:1}.machine-header>:nth-child(2){grid-column:2;grid-row:1;font-size:13px;max-width:52vw}.machine-header>:nth-child(4){grid-column:3;grid-row:1;font-size:11px;justify-self:start!important}.machine-header>:nth-child(3){grid-column:4;grid-row:1;justify-self:end!important}.machine-header>:nth-child(5){grid-column:1/4;grid-row:2;justify-self:start!important}.machine-header>:nth-child(6){grid-column:4;grid-row:2;justify-self:end!important}.machine-header>:nth-child(7){grid-column:1/4;grid-row:3}.machine-header>:nth-child(8){grid-column:4;grid-row:3;justify-self:end;text-align:right}.machine-header>:nth-child(9){grid-column:1/-1;grid-row:4;justify-self:start!important;flex-wrap:wrap}.g-dot .ms-label{display:none}.g-date-label{display:none}.tab-btn{padding:10px 14px;font-size:13px}#ab-timeline{--ab-lbl-w:104px;--ab-note-w:84px}.ab-timeline-lbl{width:104px;min-width:104px;font-size:12px}.ab-note{font-size:11px}.ab-table{font-size:12px}.ab-table th,.ab-table td{padding:6px 5px}.ab-version{padding:2px 6px;margin:1px}.machine-meta{font-size:11px}.machine-header{row-gap:8px}.machine-actions{gap:4px}.btn-icon{width:36px;height:36px}.btn-launch{height:36px;padding:0 12px}.ab-table .btn-sm{min-height:32px}}
@media(max-width:480px){.stat-pill{padding:6px 10px}.stat-pill b{font-size:15px}.gantt-lbl,.gantt-row-lbl,.gantt-mhdr-lbl{width:88px;min-width:88px}.gantt-lbl{padding:6px 8px}.gantt-row-lbl{padding:4px 6px 4px 8px}.g-dot{width:10px;height:10px;transform:translateX(-5px)}.g-date-label{display:none}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar select,.toolbar input{width:100%;min-width:0;min-height:36px}.toolbar input{grid-column:1/-1}.tab-btn{flex:1;text-align:center;min-width:0;padding:10px 8px}#ab-timeline{--ab-lbl-w:96px;--ab-note-w:76px}.ab-timeline-lbl{width:96px;min-width:96px;padding:0 8px}.ab-note{padding:0 6px 0 4px}.ab-version{display:inline-block;padding:1px 6px;margin:1px}.section{padding:10px;margin-top:14px}.section-hdr h2{font-size:14px}.btn-theme{padding:0 9px}.btn-theme .lbl{display:none}.machine-name{font-size:13px}.side-name small{display:none}.modal{padding:16px;width:95%}}
@media(max-width:600px){
  #ab-table-area{overflow-x:visible!important}

  .ab-table thead{display:none}
  .ab-table tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .ab-table tr:hover{background:none}
  .ab-table td{display:block;padding:0;border:0}
  .ab-table td:nth-child(1){order:1;flex:1 1 calc(100% - 96px);min-width:0;font-size:14px}
  .ab-table td:nth-child(5){order:2;margin-left:auto}
  .ab-table td:nth-child(2),.ab-table td:nth-child(3),.ab-table td:nth-child(4),.ab-table td:nth-child(6){order:3;font-size:12px;color:var(--ink-2)}

<a class="skip-link" href="#app">跳到主要內容</a>
<div class="shell">
<header class="side">
  <div class="side-brand"><span class="brand-mark" aria-hidden="true">呱</span><span class="side-name"><b>機率部門</b><small>專案時程管理儀表板</small></span></div>
  <nav class="tab-nav" role="tablist" aria-label="儀表板分頁" aria-orientation="vertical">

    </div>

<main id="app" tabindex="-1" style="display:none">
  <div class="tab-content active" id="tab-timeline" role="tabpanel" aria-labelledby="tabbtn-timeline" tabindex="0">
  <div class="page-hd"><h1>專案時程</h1></div>
  <div class="stat-pills" id="kpis"></div>
  <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:20px">

  </div>
  <div class="section">
    <div class="section-hdr"><h2>甘特圖（週粒度）</h2><div class="gantt-toggle"><button class="btn btn-sm" id="btn-milestone" data-action="setGanttView" data-view="milestone">里程碑</button><button class="btn btn-sm" id="btn-detail" data-action="setGanttView" data-view="detail">詳細</button><span class="gantt-sep" aria-hidden="true"></span><button class="btn btn-sm" id="btn-range-focus" data-action="setGanttRange" data-range="focus" title="今天前 3 週到後 10 週">近期</button><button class="btn btn-sm" id="btn-range-all" data-action="setGanttRange" data-range="all" title="所有資料的時間範圍">全部</button></div></div>

/* ---- P1-1: WCAG-safe badge colours. Keep the stage hue; force text dark (OKLCH L~.45) and background pale (L~.955). ---- */
function _hexRgb(h){h=(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))h='9ca3af';return [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255)}
function _lin(c){return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)}
function _gam(c){c=Math.min(1,Math.max(0,c));return c<=.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-.055}

function _toOklch(rgb){const [r,g,b]=rgb.map(_lin);const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);const L=.2104542553*l+.793617785*m-.0040720468*s,a=1.9779984951*l-2.428592205*m+.4505937099*s,bb=.0259040371*l+.7827717662*m-.808675766*s;return {L:L,C:Math.hypot(a,bb),h:Math.atan2(bb,a)}}
function _fromOklch(L,C,h){const a=C*Math.cos(h),b=C*Math.sin(h);let l=L+.3963377774*a+.2158037573*b,m=L-.1055613458*a-.0638541728*b,s=L-.0894841775*a-1.291485548*b;l=l*l*l;m=m*m*m;s=s*s*s;return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s].map(_gam)}
function _css(rgb){return 'rgb('+rgb.map(v=>Math.round(v*255)).join(',')+')'}
const _badgeCache={};
function badgeColors(hex){
  const dark=isDark(),key=(dark?'d:':'l:')+hex;
  if(_badgeCache[key])return _badgeCache[key];
  const o=_toOklch(_hexRgb(hex)),C=Math.min(o.C,.13);
  let bg,L,fg;
  if(dark){
    // dark: dim tinted background, light text; raise text lightness until it reads
    bg=_fromOklch(.30,Math.min(o.C*.6,.06),o.h);

    while(_ratio(fg,bg)<4.5&&L<.97){L+=.02;fg=_fromOklch(L,C,o.h)}

    bg=_fromOklch(.955,Math.min(o.C*.5,.035),o.h);
    L=.45;fg=_fromOklch(L,C,o.h);
    while(_ratio(fg,bg)<4.5&&L>.2){L-=.02;fg=_fromOklch(L,C,o.h)}
  }

}
function badgeStyle(hex){const c=badgeColors(hex);return 'background:'+c.bg+';color:'+c.fg}

// --- P2-1b: 深色模式 ---

  const p=themePref();

function diffDays(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function stageStatus(s){
  if(s.actualEnd)return 'green';
  if(!s.planEnd)return 'green';
  var daysLeft=diffDays(TODAY,s.planEnd);
  if(daysLeft<0)return 'red';
  if(daysLeft<=CONFIG.WARN_DAYS)return 'yellow';
  return 'green';
}

// === Data ===
function groupByMachine(data){const map=new Map();data.forEach(r=>{if(!map.has(r.machine))map.set(r.machine,[]);map.get(r.machine).push(r)});return map;}

function getMachineStatus(stages){
  const allDone=stages.every(s=>s.actualEnd);
  const anyStarted=stages.some(s=>s.actualStart);
  if(allDone)return 'done';
  if(anyStarted)return 'active';
  return 'pending';
}

function getWeightedProgress(stages){
  let totalDays=0,doneDays=0;
  stages.forEach(s=>{
    let days=1;
    if(s.planStart&&s.planEnd)days=Math.max(1,diffDays(s.planStart,s.planEnd));
    else if(s.actualStart&&s.actualEnd)days=Math.max(1,diffDays(s.actualStart,s.actualEnd));
    if(s.planStart||s.planEnd||s.actualStart||s.actualEnd){
      totalDays+=days;
      if(s.actualEnd)doneDays+=days;
    }
  });
  return totalDays?Math.round(doneDays/totalDays*100):0;
}

// 機台健康燈：任一未完成階段/里程碑逾期→red，接近死線→yellow，否則green
function machHealth(stages){
  let health='green';
  stages.filter(s=>!s.actualEnd&&s.planEnd).forEach(s=>{
    const st=stageStatus(s);
    if(st==='red')health='red';
    else if(st==='yellow'&&health!=='red')health='yellow';
  });
  return health;
}
// 下一個未完成里程碑（依 planEnd 最近者）
function nextMilestone(stages){
  let best=null;
  stages.filter(s=>s.type==='里程碑'&&!s.actualEnd).forEach(s=>{
    const d=s.planEnd||s.actualStart;if(!d)return;
    if(!best||d<best.date)best={stage:s.stage,date:d,daysLeft:diffDays(TODAY,d),st:stageStatus(s)};
  });
  return best;
}

  openModal(`<h3>更新機台狀態 — ${esc(name)}</h3>
    <div class="fg"><label>目前狀態（自由描述，例：開發中—金框動畫）</label><input id="mst-status" value="${esc(info.status||'')}" placeholder="這台現在到哪了？"></div>

// Read with retry. Apps Script intermittently 404s on its own content redirect;
// retrying the same GET is safe because reads have no side effects.
const READ_TRIES=3, READ_BUDGET_MS=60000;
function readHint(msg){
  const l=document.getElementById('loading');
  if(!l||getComputedStyle(l).display==='none')return;
  let h=document.getElementById('slow-hint');
  if(!h){l.insertAdjacentHTML('beforeend','<div id="slow-hint" style="margin-top:10px;font-size:12px;color:var(--ink-2)"></div>');h=document.getElementById('slow-hint')}
  h.textContent=msg;
}
async function readJson(url){
  const deadline=Date.now()+READ_BUDGET_MS;
  let lastErr=null;
  for(let i=0;i<READ_TRIES;i++){
    if(Date.now()>=deadline)break;
    if(i>0){
      readHint('後端回應不穩，重試中（第 '+(i+1)+'/'+READ_TRIES+' 次）…');
      await new Promise(ok=>setTimeout(ok,Math.min(1000*Math.pow(2,i-1),4000)));
    }
    try{
      const resp=await fetchT(url,{redirect:'follow'},30000);
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      return JSON.parse(await resp.text());
    }catch(e){lastErr=e}
  }
  throw lastErr||new Error('讀取失敗');
}

// fetch with a hard timeout — a hanging endpoint must fail loudly, not spin forever
function fetchT(url,opts,ms){
  const ac=(typeof AbortController!=='undefined')?new AbortController():null;
  const t=setTimeout(()=>{if(ac)ac.abort()},ms||30000);
  return fetch(url,Object.assign({},opts||{},ac?{signal:ac.signal}:{}))
    .finally(()=>clearTimeout(t));
}

// === Load-failure state (never substitute demo data for a failed read) ===
let dataLoadFailed=false, abLoadFailed=false, sideDataFailed=false, slowHintTimer=null;
function loadFailHtml(title){return '<div style="text-align:center;padding:22px 12px;color:var(--ink-2);font-size:13px">'
  +'<div style="font-size:14px;font-weight:600;color:var(--crit-ink);margin-bottom:6px">\u26a0 '+title+'</div>'
  +'<div>後端暫時沒有回應。為避免顯示與實際不符的資料，這裡不會顯示任何內容。</div>'
  +'<button type="button" class="btn btn-primary" style="margin-top:10px" data-action="reload">重新載入</button></div>'}

// === 快取：先顯示上次成功讀到的資料，背景再更新 ===
const CACHE_KEY='tl:cache:'+CONFIG.SHEET_ID, AB_CACHE_KEY='tl:abcache:'+CONFIG.SHEET_ID;
let _bootDone=false,_abBootDone=false,cacheShownAt=null,abCacheShownAt=null;
function cacheGet(k){try{const v=JSON.parse(lsGet(k)||'null');return v&&v.t&&v.r?v:null}catch(e){return null}}
function cacheSet(k,r){try{lsSet(k,JSON.stringify({t:Date.now(),r}))}catch(e){}}
function cacheStamp(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
// everything the main read feeds into page state, shared by the cached and the live path
function applyRead(r){
  if(r.stages&&Array.isArray(r.stages)&&r.stages.length>0){STAGES=r.stages.map(s=>s.name);STAGE_COLORS={};STAGE_TYPES={};r.stages.forEach(s=>{STAGE_COLORS[s.name]=s.color||'#9ca3af';STAGE_TYPES[s.name]=s.type||'工作階段'})}
  if(r.abTags&&Array.isArray(r.abTags)&&r.abTags.length>0)AB_TAGS=r.abTags;
  if(r.abMarkets&&Array.isArray(r.abMarkets)&&r.abMarkets.length>0)AB_MARKETS=r.abMarkets;
  if(r.launchChecklist&&Array.isArray(r.launchChecklist)&&r.launchChecklist.length>0)LAUNCH_CHECKLIST=r.launchChecklist;
  rawData=(r.data||[]).map(d=>({row:d.row||0,machine:d.machine||'',stage:d.stage||'',planStart:normDate(d.planStart),planEnd:normDate(d.planEnd),actualStart:normDate(d.actualStart),actualEnd:normDate(d.actualEnd),owner:d.owner||'',note:d.note||'',priority:d.priority||'',type:d.type||'工作階段'}));
  machStatusMap=r.statuses||{};
  issuesList=Array.isArray(r.issues)?r.issues:[];
  linksList=Array.isArray(r.links)?r.links:[];
  BACKEND_CAPS=r.caps||{};
  dataLoadFailed=false;sideDataFailed=false;
}

// === Load ===
async function loadData(){
  const loading=document.getElementById('loading'),err=document.getElementById('error-banner'),src=document.getElementById('source-note');
  // the backend can legitimately take ~20s; say so instead of looking frozen
  slowHintTimer=setTimeout(()=>{if(loading&&getComputedStyle(loading).display!=='none'&&!document.getElementById('slow-hint'))loading.insertAdjacentHTML('beforeend','<div id="slow-hint" style="margin-top:10px;font-size:12px;color:var(--ink-2)">後端回應較慢，仍在等待…</div>')},8000);
  if(!CONFIG.SHEET_ID){rawData=DEMO_DATA;machStatusMap=MACH_STATUS_DEMO;issuesList=ISSUES_DEMO;linksList=LINKS_DEMO;src.textContent='Demo';finish();return}
  // first load only: paint the last good read right away, then refresh in the background
  let usedCache=false;
  if(!_bootDone&&canEdit()){
    const c=cacheGet(CACHE_KEY);
    if(c){applyRead(c.r);cacheShownAt=c.t;usedCache=true;src.textContent='Google Sheet（'+cacheStamp(c.t)+' 快取，更新中…）';finish()}
  }
  try{
    if(canEdit()){
      // Retry up to 2 times — Google Apps Script sometimes returns HTML on first call
      let r=null;
      try{r=await readJson(CONFIG.APPS_SCRIPT_URL)}catch(e){r=null}
      if(r&&r.success){
        applyRead(r);cacheSet(CACHE_KEY,r);cacheShownAt=null;
        src.textContent='Google Sheet（即時）';err.style.display='none';finish();return;
      }
      // live read failed but the cache is already on screen: keep it, say so, and stop here
      if(usedCache){clearTimeout(slowHintTimer);src.textContent='Google Sheet（'+cacheStamp(cacheShownAt)+' 快取）';err.textContent='\u26a0 後端未回應，目前顯示的是 '+cacheStamp(cacheShownAt)+' 抓到的資料，可能不是最新。';err.style.display='block';return}
    }
    // Apps Script did not answer — fall back to reading the sheet directly.
    // That route returns the stage rows only, so issues / links / machine status are NOT available.
    sideDataFailed=true;
    let text;try{const r=await fetchT(gvizUrl('csv'),null,30000);if(r.ok)text=await r.text()}catch(e){}
    if(text)rawData=parseCsv(text);else{const r=await fetchT(gvizUrl('json'),null,30000);rawData=parseGvizJson(await r.text())}
    src.textContent='Google Sheet（僅時程）';
    err.textContent='後端未回應，已改用試算表直讀：只有機台時程是最新的，議題／常用連結／機台狀態未載入。請重新整理再試。';err.style.display='block';
    finish();
  }catch(e){
    if(usedCache){clearTimeout(slowHintTimer);src.textContent='Google Sheet（'+cacheStamp(cacheShownAt)+' 快取）';err.textContent='\u26a0 後端未回應，目前顯示的是 '+cacheStamp(cacheShownAt)+' 抓到的資料，可能不是最新。';err.style.display='block';return}
    err.textContent='讀取失敗：'+(e.message||e)+'　資料未載入，請重新整理。';err.style.display='block';rawData=[];machStatusMap={};issuesList=[];linksList=[];dataLoadFailed=true;src.textContent='讀取失敗';finish()
  }
}
function gvizUrl(f){return`https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:${f}&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`}
function parseCsv(text){const lines=text.split('\n').filter(l=>l.trim());const res=[];for(let i=1;i<lines.length;i++){const c=csvLine(lines[i]);if(c.length>=2)res.push({row:i+1,machine:c[0],stage:c[1],planStart:normDate(c[2]),planEnd:normDate(c[3]),actualStart:normDate(c[4]),actualEnd:normDate(c[5]),owner:c[6]||'',note:c[7]||'',priority:c[8]||'',type:c[9]||'工作階段'})}return res}
function csvLine(l){const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===','){r.push(c.trim());c=''}else c+=ch}}r.push(c.trim());return r}
function parseGvizJson(text){const m=text.match(/google\.visualization\.Query\.setResponse\(([\s\S]+)\);?\s*$/);const j=JSON.parse(m?m[1]:text);return j.table.rows.map((row,i)=>{const c=row.c||[];const v=idx=>{if(!c[idx]||c[idx].v==null)return '';const val=c[idx].v;if(typeof val==='string'&&val.startsWith('Date(')){const p=val.match(/Date\((\d+),(\d+),(\d+)\)/);if(p)return p[1]+'-'+String(Number(p[2])+1).padStart(2,'0')+'-'+p[3].padStart(2,'0')}return String(val)};return{row:i+2,machine:v(0),stage:v(1),planStart:normDate(v(2)),planEnd:normDate(v(3)),actualStart:normDate(v(4)),actualEnd:normDate(v(5)),owner:v(6),note:v(7),priority:v(8),type:v(9)||'工作階段'}})}

function finish(){
  clearTimeout(slowHintTimer);
  _bootDone=true;
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='';
  if(canEdit())document.querySelectorAll('.edit-only').forEach(el=>el.style.display='');

// a machine has one owner (submitOwner writes it to every stage row); when rows disagree,
// take the most common non-empty value so a single stray row cannot flip the display
function machineOwner(stages){const cnt={};stages.forEach(s=>{if(s.owner)cnt[s.owner]=(cnt[s.owner]||0)+1});let best='',n=0;Object.keys(cnt).forEach(o=>{if(cnt[o]>n){best=o;n=cnt[o]}});return best}
function ownerMixed(stages){return new Set(stages.map(s=>s.owner).filter(Boolean)).size>1}
function populateFilters(){
  const sel=document.getElementById('filter-owner');
  const cur=sel.value;
  const owners=[...new Set(rawData.map(r=>r.owner).filter(Boolean))];
  sel.innerHTML='<option value="">全部負責人</option>'+owners.map(o=>`<option${o===cur?' selected':''}>${esc(o)}</option>`).join('');

function render(){renderKPI();renderTable();renderGantt();renderIssues();renderLinks()}

function getFilteredMachines(){
  const status=document.getElementById('filter-status').value;
  const owner=document.getElementById('filter-owner').value;
  const search=document.getElementById('filter-search').value.toLowerCase();
  const machines=groupByMachine(rawData);
  const filtered=[];
  machines.forEach((stages,name)=>{
    const ms=getMachineStatus(stages);
    if(status==='active'&&ms==='done')return;
    if(status==='done'&&ms!=='done')return;
    if(owner&&machineOwner(stages)!==owner)return;
    if(search&&!name.toLowerCase().includes(search))return;
    filtered.push([name,stages]);
  });
  // sort by how soon the next unfinished milestone is due: overdue first, then nearest;
  // machines with nothing left to hit (or no dated milestone) sink to the bottom
  const urgency=st=>{const nm=nextMilestone(st);return nm&&nm.date?nm.date:null};
  filtered.sort((a,b)=>{
    const ua=urgency(a[1]),ub=urgency(b[1]);
    if(ua&&ub)return ua<ub?-1:ua>ub?1:a[0].localeCompare(b[0],'zh-Hant');
    if(ua)return -1;
    if(ub)return 1;
    return a[0].localeCompare(b[0],'zh-Hant');
  });
  const result=new Map();
  filtered.forEach(([n,s])=>result.set(n,s));
  return result;
}
function firstMilestoneDate(stages){
  let earliest=null;
  stages.filter(s=>s.type==='里程碑').forEach(s=>{
    const d=s.planEnd||s.actualEnd||s.planStart||s.actualStart;
    if(d&&(!earliest||d<earliest))earliest=d;
  });
  if(earliest)return earliest;
  // 無里程碑 → 退回所有階段最早日期
  stages.forEach(s=>{[s.planStart,s.planEnd,s.actualStart,s.actualEnd].forEach(d=>{if(d&&(!earliest||d<earliest))earliest=d})});
  return earliest||null;
}
function getLaunchDate(stages){
  const launch=stages.find(s=>s.type==='里程碑'&&(/上線/.test(s.stage)));
  if(launch&&launch.planEnd)return launch.planEnd;
  let latest='';
  stages.forEach(s=>{if(s.planEnd&&s.planEnd>latest)latest=s.planEnd});
  return latest||null;
}

function renderKPI(){
  const T=TODAY;
  const in7=new Date(new Date(T+'T00:00:00').getTime()+7*86400000).toISOString().slice(0,10);
  const curMonth=T.slice(0,7);
  let overdue=0,due7=0,launchM=0;
  rawData.forEach(s=>{
    if(s.type==='里程碑'&&!s.actualEnd&&s.planEnd){
      if(s.planEnd<T)overdue++;
      else if(s.planEnd<=in7)due7++;
    }
    if(s.type==='里程碑'&&s.stage==='上線(OKBet)'&&s.planEnd&&s.planEnd.slice(0,7)===curMonth)launchM++;
  });
  const blockers=(typeof issuesList!=='undefined'?issuesList:[]).filter(i=>i.status!=='已解決'&&i.severity==='阻塞').length;
  // 一排指標膠囊：只有數字大於 0 才上紅／黃底
  const pill=(label,val,tone)=>`<span class="stat-pill${tone&&val>0?' '+tone:''}"><b>${val}</b>${label}</span>`;
  const f=dataLoadFailed;
  document.getElementById('kpis').innerHTML=
    pill('逾期里程碑',f?'—':overdue,'crit')+
    pill('本週到期',f?'—':due7,'warn')+
    pill('本月上線',f?'—':launchM,'')+
    pill('阻塞議題',(f||sideDataFailed)?'—':blockers,'crit');
}

function renderGantt(){
  document.getElementById('btn-milestone').className='btn btn-sm'+(ganttView==='milestone'?' active':'');
  document.getElementById('btn-detail').className='btn btn-sm'+(ganttView==='detail'?' active':'');
  document.getElementById('btn-range-focus').className='btn btn-sm'+(ganttRange==='focus'?' active':'');
  document.getElementById('btn-range-all').className='btn btn-sm'+(ganttRange==='all'?' active':'');
  [['btn-milestone',ganttView==='milestone'],['btn-detail',ganttView==='detail'],['btn-range-focus',ganttRange==='focus'],['btn-range-all',ganttRange==='all']].forEach(([id,on])=>document.getElementById(id).setAttribute('aria-pressed',on?'true':'false'));
  const lg=document.getElementById('gantt-legend');if(lg)lg.dataset.view=ganttView==='detail'?'detail':'milestone';
  const machines=getFilteredMachines();
  const weeks=getWeeks(),total=weeks.length;
  // 週寬：至少 52px（手機 40px），近期模式週數少時放大填滿容器，刻度與資料點共用同一個寬度
  const gEl=document.getElementById('gantt');
  const lblW=innerWidth<=480?88:innerWidth<=768?120:180,minWk=innerWidth<=480?40:52;
  GANTT_WK=Math.max(minWk,Math.floor(((gEl.parentElement.clientWidth||0)-lblW)/total));
  gEl.style.setProperty('--wk',GANTT_WK+'px');
  let mh='<div class="gantt-mhdr"><div class="gantt-mhdr-lbl"></div>';
  let wi=0;
  while(wi<weeks.length){
    const ym=weeks[wi].getFullYear()+'-'+weeks[wi].getMonth();
    let cnt=0; while(wi+cnt<weeks.length && (weeks[wi+cnt].getFullYear()+'-'+weeks[wi+cnt].getMonth())===ym) cnt++;
    mh+=`<div class="gantt-month${weeks[wi].getMonth()%2?' alt':''}" style="flex:0 0 ${cnt*GANTT_WK}px;width:${cnt*GANTT_WK}px">${weeks[wi].getFullYear()}/${String(weeks[wi].getMonth()+1).padStart(2,'0')}</div>`;
    wi+=cnt;
  }
  mh+='</div>';
  let html='<div class="gantt-today-lane"></div>'+mh+`<div class="gantt-hdr"><div class="gantt-lbl">機台${ganttView==='detail'?' / 階段':''}</div><div class="gantt-timeline">`;
  weeks.forEach(w=>{html+=`<div class="gantt-wk">${String(w.getMonth()+1).padStart(2,'0')}/${String(w.getDate()).padStart(2,'0')}</div>`});
  html+=`</div></div>`;

  if(ganttView==='milestone') html+=renderGanttMilestone(machines,weeks,total);
  else html+=renderGanttDetail(machines,weeks,total);

  document.getElementById('gantt').innerHTML=html;
  addTodayLine(weeks);

  const lane=gEl.querySelector('.gantt-today-lane'),wrapEl=gEl.parentElement;
  if(lane)lane.textContent=(wrapEl&&wrapEl.scrollWidth>wrapEl.clientWidth+1)?'↔ 左右捲動可看完整時間軸':'';
}

function renderGanttMilestone(machines,weeks,total){
  let html='';
  machines.forEach((stages,name)=>{
    const milestones=stages.filter(s=>s.type==='里程碑');
    const milestonesWithDate=milestones.filter(s=>s.planEnd||s.actualEnd||s.planStart);
    // Skip machines with no milestones that have dates — nothing to show in milestone view
    if(milestonesWithDate.length===0)return;
    // Find overall span from milestone dates only
    let minD=null,maxD=null;
    milestonesWithDate.forEach(s=>{[s.planStart,s.planEnd,s.actualStart,s.actualEnd].forEach(d=>{if(d){if(!minD||d<minD)minD=d;if(!maxD||d>maxD)maxD=d}})});
    // Only show milestone-type items.
    // P2-5: two milestones inside roughly one dot-width of each other would draw on top of
    // one another, so alternate them between an upper and a lower lane.
    const tlPx=Math.max(weeks.length*GANTT_WK,1);
    const minGapPct=16/tlPx*100;
    const allItems=milestonesWithDate.map(s=>{
      const dt=s.planEnd||s.actualEnd||s.planStart;
      return dt?{s:s,dt:dt,pos:datePosRaw(weeks,dt)*100}:null;
    }).filter(Boolean).sort((a,b)=>a.pos-b.pos);
    // P3-3: 範圍外的點不畫在邊界上（會誤讀成那一週的事件），改在列的兩端提示
    const items=allItems.filter(it=>it.pos>=0&&it.pos<=100),past=allItems.filter(it=>it.pos<0),future=allItems.filter(it=>it.pos>100);
    // first lane with clearance; open a new one when none is free (up to MAX_LANES)
    const MAX_LANES=3,lastByLane=[-Infinity];
    items.forEach(it=>{
      let lane=lastByLane.findIndex(p=>it.pos-p>=minGapPct);
      if(lane<0){
        if(lastByLane.length<MAX_LANES){lane=lastByLane.length;lastByLane.push(-Infinity)}
        else lane=lastByLane.indexOf(Math.min.apply(null,lastByLane));
      }
      it.lane=lane;lastByLane[lane]=it.pos;
    });
    const laneCount=items.reduce((m,it)=>Math.max(m,it.lane+1),1);
    const rowH=Math.max(38,8+laneCount*16);
    html+=`<div class="gantt-row ms-row" style="min-height:${rowH}px"><div class="gantt-row-lbl" title="${esc(name)}">${esc(name)}</div><div class="gantt-row-tl" style="height:${rowH}px">`;
    html+=ganttCells(weeks);
    if(minD&&maxD){const l=datePos(weeks,minD)*100,r=datePos(weeks,maxD)*100;if(!(l===r&&(l===0||l===100)))html+=`<div class="g-bar" style="left:${l}%;width:${Math.max(r-l,.5)}%;background:var(--plan)"></div>`}
    const nm=nextMilestone(stages);
    items.forEach((it,idx)=>{
      const st=stageStatus(it.s);
      const nxt=items[idx+1];
      // label only the next milestone, and only when the following dot is far enough away
      const room=!nxt||(nxt.pos-it.pos)*tlPx/100>64;
      const isNext=nm&&nm.stage===it.s.stage&&!it.s.actualEnd;
      const label=(isNext&&room)?`<div class="ms-label${it.pos>88?' ms-label-l':''}">${esc(it.s.stage)}</div>`:'';
      // 已完成的里程碑畫成灰色空心點：綠色只代表「還沒到、來得及」
      const stTxt=it.s.actualEnd?'已完成':st==='green'?'如期':st==='yellow'?'即將到期':'逾期';
      html+=`<div class="g-dot ${it.s.actualEnd?'g-dot-done':'g-dot-'+st}" tabindex="0" role="img" aria-label="${esc(it.s.stage)} ${fmtDate(it.dt)}，${stTxt}" style="left:min(${it.pos.toFixed(3)}%,calc(100% - 8px));top:${4+it.lane*16}px">${label}<div class="g-tooltip">${esc(it.s.stage)} ${fmtDate(it.dt)} · ${stTxt}</div></div>`;
    });
    if(past.length){const p=past[past.length-1];html+=`<div class="g-edge g-edge-l" title="${past.length} 個里程碑在範圍之前，最近的是 ${esc(p.s.stage)} ${fmtDate(p.dt)}">◂ ${past.length}${items.length?'':' · '+esc(p.s.stage)+' '+fmtDate(p.dt)}</div>`}
    if(future.length){const f=future[0],lastPos=items.length?items[items.length-1].pos:-1,tight=lastPos>70;html+=`<div class="g-edge g-edge-r${lastPos>93?' g-edge-b':''}" title="${future.length} 個里程碑在範圍之後，下一個是 ${esc(f.s.stage)} ${fmtDate(f.dt)}">${tight?'':esc(f.s.stage)+' '+fmtDate(f.dt)+' '}▸ ${future.length}</div>`}
    html+=`</div></div>`;
  });
  return html;
}

function renderGanttDetail(machines,weeks,total){
  let html='';
  machines.forEach((stages,name)=>{
    html+=`<div class="gantt-group-label">${esc(name)}</div>`;
    stages.forEach(s=>{
      html+=`<div class="gantt-row"><div class="gantt-row-lbl" title="${esc(s.stage)}">${esc(s.stage)}</div><div class="gantt-row-tl">`;
      html+=ganttCells(weeks);
      const color=STAGE_COLORS[s.stage]||'#6366f1';
      if(s.planStart&&s.planEnd){const l=datePos(weeks,s.planStart)*100,r=datePos(weeks,s.planEnd)*100;if(!(l===r&&(l===0||l===100)))html+=`<div class="g-plan" style="left:${l}%;width:${Math.max(r-l,.5)}%;background:${color}"></div>`}
      else if(s.planEnd&&!s.planStart){const p=datePosRaw(weeks,s.planEnd)*100;if(p>=0&&p<=100)html+=`<div class="g-milestone" tabindex="0" role="img" title="${esc(s.stage)} ${fmtDate(s.planEnd)}" aria-label="${esc(s.stage)} ${fmtDate(s.planEnd)}" style="left:calc(${Math.min(p,99.2)}% - 6px);border-color:${color}"></div>`}
      if(s.actualStart){const l=datePos(weeks,s.actualStart)*100,r=(s.actualEnd?datePos(weeks,s.actualEnd):datePos(weeks,TODAY))*100;if(!(l===r&&(l===0||l===100)))html+=`<div class="g-actual" style="left:${l}%;width:${Math.max(r-l,.5)}%;background:${color}"></div>`}
      html+=`</div></div>`;

function addTodayLine(weeks){
  const todayPos=datePos(weeks,TODAY)*100;
  if(todayPos<=0||todayPos>=100)return;
  const ganttEl=document.getElementById('gantt');
  const hdr=ganttEl.querySelector('.gantt-hdr');
  if(!hdr)return;
  const tlEl=hdr.querySelector('.gantt-timeline');
  if(!tlEl)return;
  const line=document.createElement('div');
  line.className='today-line';
  line.style.left=(tlEl.offsetLeft+tlEl.offsetWidth*todayPos/100)+'px';
  line.innerHTML='<div class="today-label">今天</div>';
  ganttEl.appendChild(line);
}

function getWeeks(){
  if(ganttRange==='focus'){
    const t=new Date(TODAY+'T00:00:00').getTime();
    const s=mondayOf(new Date(t-86400000*21)),e=new Date(t+86400000*70),weeks=[];
    const c=new Date(s);while(c<=e){weeks.push(new Date(c));c.setDate(c.getDate()+7)}return weeks;
  }
  let min=Infinity,max=-Infinity;
  rawData.forEach(r=>{[r.planStart,r.planEnd,r.actualStart,r.actualEnd].forEach(d=>{if(d){const t=new Date(d+'T00:00:00').getTime();if(t<min)min=t;if(t>max)max=t}})});
  if(min===Infinity){min=Date.now();max=Date.now()+86400000*90}
  const s=mondayOf(new Date(min-86400000*7)),e=new Date(max+86400000*14),weeks=[];
  const c=new Date(s);while(c<=e){weeks.push(new Date(c));c.setDate(c.getDate()+7)}return weeks;
}
// unclamped position: callers decide what to do with points outside the range
function datePosRaw(weeks,dateStr){const total=weeks.length;const d=new Date(dateStr.slice(0,10)+'T00:00:00');const start=weeks[0].getTime();const end=weeks[total-1].getTime()+7*86400000;return (d.getTime()-start)/(end-start)}
function ganttCells(weeks){return weeks.map(w=>'<div class="gantt-cell'+(w.getMonth()%2?' alt':'')+'"></div>').join('')}
function mondayOf(d){const r=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=r.getDay();r.setDate(r.getDate()-((day+6)%7));return r}
function datePos(weeks,dateStr){
  const total=weeks.length;
  const d=new Date(dateStr.slice(0,10)+'T00:00:00');
  const start=weeks[0].getTime();
  const end=weeks[total-1].getTime()+7*86400000;
  return Math.max(0,Math.min(1,(d.getTime()-start)/(end-start)));
}

function toast(msg,type){
  const wrap=document.getElementById('toast-wrap');if(!wrap)return;
  const t=document.createElement('div');t.className='toast toast-'+(type||'ok');if(type==='err')t.setAttribute('role','alert');t.textContent=msg;
  wrap.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)}, type==='err'?5500:2200);
}
let _okToastT;
function okToast(){clearTimeout(_okToastT);_okToastT=setTimeout(()=>toast('✓ 已儲存','ok'),400)}
// 後端在 readAll 回的 caps：reqId＝支援去重（寫入可安全重送）、writeKey＝有設寫入密鑰
let BACKEND_CAPS={};
function newReqId(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(16).slice(2)}
// 問使用者要寫入密鑰；用 confirm-dlg 這個獨立 dialog，可以疊在其他彈窗上
function askWriteKey(){
  return new Promise(resolve=>{
    const d=document.getElementById('confirm-dlg');
    d.innerHTML='<h3 id="confirm-title" style="margin-bottom:8px">需要寫入密鑰</h3>'
      +'<p style="font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:10px">這個儀表板的後端已啟用寫入保護。請輸入管理者給你的密鑰，之後會記在這台裝置的瀏覽器裡。</p>'
      +'<div class="fg"><label for="wk-input">寫入密鑰</label><input id="wk-input" type="password" autocomplete="off" value="'+esc(lsGet('writeKey')||'')+'"></div>'
      +'<div class="modal-btns"><button type="button" class="btn btn-cancel" data-act="cancel">取消</button><button type="button" class="btn btn-primary" data-act="ok">確定</button></div>';
    let done=false;
    const finish=v=>{if(done)return;done=true;if(d.open)d.close();resolve(v)};
    d.querySelector('[data-act="ok"]').onclick=()=>finish((document.getElementById('wk-input').value||'').trim()||null);
    d.querySelector('[data-act="cancel"]').onclick=()=>finish(null);
    d.querySelector('#wk-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();d.querySelector('[data-act="ok"]').click()}});
    if(!d.open)d.showModal();
    d.querySelector('#wk-input').focus();
  });
}
async function apiPost(body,_afterKey){
  // 後端支援去重時才帶 reqId，也只有帶了 reqId 才敢重送（沒帶的話重送可能多寫一列）
  if(BACKEND_CAPS.reqId&&!body.reqId)body.reqId=newReqId();
  if(BACKEND_CAPS.writeKey){
    let k=lsGet('writeKey');
    // no key on this device yet: ask now instead of after a slow refusal from the backend
    if(!k&&!_afterKey){k=await askWriteKey();if(!k){toast('⚠ 沒有寫入密鑰，這次沒有存檔','err');return{success:false}}lsSet('writeKey',k)}
    if(k)body.key=k;
  }
  const tries=body.reqId?3:1;
  let j=null,lastErr=null;
  for(let i=0;i<tries;i++){
    if(i>0){toast('後端回應不穩，重送中（第 '+(i+1)+'/'+tries+' 次）…','');await new Promise(ok=>setTimeout(ok,1000*i))}
    try{
      const params=encodeURIComponent(JSON.stringify(body));
      const r=await fetchT(CONFIG.APPS_SCRIPT_URL+'?payload='+params,{redirect:'follow'},30000);
      j=await r.json();lastErr=null;break;
    }catch(e){lastErr=e;j=null}
  }
  if(lastErr){
    // Google 端 404／HTML：Apps Script 多半已經執行完寫入，只是結果送不回來；不能當成沒寫
    const htmlBack=lastErr instanceof SyntaxError;
    toast(htmlBack?'⚠ 後端回應異常（Google 端 404）。這筆變更可能已經寫入，請重新整理確認後再決定是否重做。':body.reqId?'⚠ 後端沒有回應（已重送 '+tries+' 次）。這筆變更可能已經寫入，請重新整理確認後再決定是否重做。':'⚠ 操作失敗（連線錯誤）：'+(lastErr.message||lastErr),'err');
    return{success:false}
  }
  if(j&&j.success===false){
    if(j.error==='unauthorized'&&!_afterKey){
      const k=await askWriteKey();
      if(k){lsSet('writeKey',k);return apiPost(body,true)}
      toast('⚠ 沒有寫入密鑰，這次沒有存檔','err');return j;
    }
    toast('⚠ 儲存失敗：'+(j.error==='unauthorized'?'寫入密鑰不正確':(j.error||'未知錯誤'))+'（'+(body.action||'')+'）'+(j.error==='unauthorized'?'':' — 後端可能尚未部署最新版'),'err');
  }else if(j&&j.success===true){ okToast(); }
  return j;
}

function _dispatch(attr){
  return e=>{
    const el=e.target.closest('['+attr+']');
    if(!el)return;
    const fn=ACTIONS[el.getAttribute(attr)];
    if(fn)fn(el,e);
  };
}

function _dlg(){return document.getElementById('modal-bg')}
// validation used to call alert(); a toast would sit under the dialog's top layer, so the
// message goes inline at the top of the dialog instead
function modalError(msg){
  const c=document.getElementById('modal-content');
  if(!c){toast(msg,'err');return}
  let e=c.querySelector('.modal-err');
  if(!e){e=document.createElement('div');e.className='modal-err';e.setAttribute('role','alert');c.insertBefore(e,c.firstChild)}
  e.textContent='⚠ '+msg;
  e.scrollIntoView({block:'nearest'});
}
// a promise-based replacement for confirm(); its own dialog so it can stack on top of an open one
function confirmDialog(msg,okText){
  return new Promise(resolve=>{
    const d=document.getElementById('confirm-dlg');
    d.innerHTML='<h3 id="confirm-title" style="margin-bottom:8px">確認</h3>'
      +'<p style="font-size:13px;color:var(--ink-2);line-height:1.6">'+esc(msg)+'</p>'
      +'<div class="modal-btns"><button type="button" class="btn btn-cancel" data-act="cancel">取消</button>'
      +'<button type="button" class="btn btn-delete" data-act="ok">'+esc(okText||'確定刪除')+'</button></div>';
    let done=false;
    // resolve from the handlers themselves — the close event is not dependable everywhere,
    // and a confirm that never resolves would leave a delete silently hanging
    const finish=v=>{
      if(done)return; done=true;
      d.removeEventListener('close',onClose);d.removeEventListener('cancel',onCancel);
      d.removeEventListener('keydown',onKey);d.removeEventListener('click',onClick);
      if(d.open)d.close(v?'ok':'cancel');
      resolve(v);
    };
    const onClose=()=>finish(d.returnValue==='ok');
    const onCancel=()=>finish(false);
    const onKey=e=>{if(e.key==='Escape')finish(false)};
    const onClick=e=>{
      if(e.target!==d)return;
      const r=d.getBoundingClientRect();
      const inside=r.top<=e.clientY&&e.clientY<=r.bottom&&r.left<=e.clientX&&e.clientX<=r.right;
      if(!inside)finish(false);
    };
    d.addEventListener('close',onClose);d.addEventListener('cancel',onCancel);
    d.addEventListener('keydown',onKey);d.addEventListener('click',onClick);
    d.querySelector('[data-act="ok"]').onclick=()=>finish(true);
    d.querySelector('[data-act="cancel"]').onclick=()=>finish(false);
    d.returnValue='';
    if(!d.open)d.showModal();
    d.querySelector('[data-act="cancel"]').focus();
  });
}
// clicking the backdrop closes; the rect test keeps clicks on the dialog's own padding inside
function _dlgBackdrop(d){
  d.addEventListener('click',e=>{
    if(e.target!==d)return;
    const r=d.getBoundingClientRect();
    const inside=r.top<=e.clientY&&e.clientY<=r.bottom&&r.left<=e.clientX&&e.clientX<=r.right;
    if(!inside)d.close();
  });
}
function _dlgInit(){
  const d=document.getElementById('modal-bg');
  if(!d)return;
  _dlgBackdrop(d);
  // native dialogs close on Esc, but do not rely on it: some engines do not fire the
  // close event, and a modal you cannot dismiss is worse than a redundant listener
  d.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_dlgInit);else _dlgInit();

  const h=c.querySelector('h3,h2');
  if(h){if(!h.id)h.id='modal-title';d.setAttribute('aria-labelledby',h.id)}else d.removeAttribute('aria-labelledby');
  if(!d.open)d.showModal();
}

  entries=entries.filter(e=>{
    if(filter==='open')return e.it.status!=='已解決';
    if(filter==='blocker')return e.it.status!=='已解決'&&e.it.severity==='阻塞';
    return true;
  });
  entries.sort((a,b)=>{const ao=a.it.status==='已解決'?1:0,bo=b.it.status==='已解決'?1:0;if(ao!==bo)return ao-bo;return (sevRank[a.it.severity]==null?1:sevRank[a.it.severity])-(sevRank[b.it.severity]==null?1:sevRank[b.it.severity])});

        <span style="display:block;font-size:11px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i.owner?esc(i.owner):'未指派'}${logN?' · <span title="處理紀錄 '+logN+' 筆">'+ic('note',12)+'<span class="sr-only">處理紀錄</span> '+logN+'</span>':''}${staleHtml}${i.updated?' · '+fmtDate(i.updated):''}</span>

    </button>`;
  }).join('');

// private IPv4 ranges, localhost, bare host names and .local/.lan/.internal are only reachable inside the office
function isIntranetUrl(url){
  let h='';try{h=new URL(url).hostname.toLowerCase()}catch(e){return false}
  if(!h)return false;
  if(/^(10.|192.168.|127.|169.254.)/.test(h))return true;
  if(/^172.(1[6-9]|2d|3[01])./.test(h))return true;
  if(h==='localhost'||/.(local|lan|internal|intra|corp)$/.test(h))return true;
  return !h.includes('.');
}

  area.innerHTML='<ul class="side-list">'+linksList.map(l=>{

function switchTab(tab,focusTab){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const on=b.id==='tabbtn-'+tab;
    b.classList.toggle('active',on);
    b.setAttribute('aria-selected',on?'true':'false');
    // only the selected tab stays in the Tab order; arrow keys move between them
    b.tabIndex=on?0:-1;
    if(on&&focusTab)b.focus();
  });
  document.querySelectorAll('.tab-content').forEach(c=>{
    const on=c.id==='tab-'+tab;
    c.classList.toggle('active',on);
    c.hidden=!on; // hidden removes the panel from the accessibility tree, not just from view
  });
  lsSet('activeTab',tab);
  // 甘特圖的週寬是依可見寬度算的；在隱藏的分頁裡算會得到 0，切回來時重算
  if(tab==='abtest')renderAB();else if(rawData.length)renderGantt();
}

// left/right (and Home/End) move between tabs, as a tablist is expected to
function _tabKeys(e){
  const dir={ArrowLeft:-1,ArrowRight:1,ArrowUp:-1,ArrowDown:1,Home:'first',End:'last'};
  if(!(e.key in dir))return;
  const btns=[...document.querySelectorAll('.tab-nav [role="tab"]')];
  if(!btns.length)return;
  const cur=btns.findIndex(b=>b.getAttribute('aria-selected')==='true');
  const step=dir[e.key];
  let next;
  if(step==='first')next=0;
  else if(step==='last')next=btns.length-1;
  else next=((cur<0?0:cur)+step+btns.length)%btns.length;
  e.preventDefault();
  switchTab(btns[next].id.replace('tabbtn-',''),true);
}
function _tabInit(){const nav=document.querySelector('.tab-nav[role="tablist"]');if(nav)nav.addEventListener('keydown',_tabKeys)}

function abFromRows(r){

    if(row.version){g.versions.push({label:row.version,date:normDate(row.versionDate)||'',winner:!!row.winner,running:!!row.running,row:row.row})}
    if(row.launchDate&&!g.launchDate)g.launchDate=normDate(row.launchDate);

  const n=(g.versions||[]).filter(v=>v.running).length;
  const hasWinner=!!abWinner(g);
  if(n===2)return null;
  if(n===0)return hasWinner?'找不到本次比較的兩個版本':null;
  if(n===1)return '本次比較只標了 1 個版本，應為 2 個';
  return '本次比較標了 '+n+' 個版本，應為 2 個';
}

function abWinner(g){return (g.versions||[]).find(v=>v.winner&&v.date)||null}
// 打磨天數＝上線日 → 打磨到的最新版本（英文字母最大的那一版）的日期。
// 只看單一字母的版本標籤；R1／R2 這類另開的測試（如新手機率）不算。沒有字母版本時退回最晚的版本日。
function abLatestVersion(g){
  const dated=(g&&g.versions||[]).filter(v=>v.date);
  const letters=dated.filter(v=>/^[A-Za-z]$/.test(String(v.label||'').trim()));
  const pool=letters.length?letters:dated;
  if(!pool.length)return null;
  const key=v=>letters.length?String(v.label).trim().toUpperCase():v.date;
  return pool.reduce((best,v)=>key(v)>key(best)||(key(v)===key(best)&&v.date>best.date)?v:best);
}
function abPolishDays(g){
  if(!g||!g.launchDate)return null;
  const v=abLatestVersion(g);
  return v?diffDays(g.launchDate,v.date):null;
}
// average over finalised games only — that is the yardstick a running game is measured against
function abAvgPolish(){
  const done=(abData||[]).filter(g=>abWinner(g)).map(abPolishDays).filter(d=>d!=null);
  return done.length?Math.round(done.reduce((s,d)=>s+d,0)/done.length):null;
}
function abPolishHtml(g){
  const d=abPolishDays(g);
  if(d==null)return '<span style="color:var(--ink-3)">—</span>';
  const done=!!abWinner(g),avg=abAvgPolish();
  const over=!done&&avg!=null&&d>avg;
  const lv=abLatestVersion(g);
  const tip='上線 '+fmtDate(g.launchDate)+' → '+esc(lv.label)+' 版 '+fmtDate(lv.date)+(over?'（已超過已定版平均 '+avg+' 天）':'');
  return '<span style="white-space:nowrap;font-weight:600;color:'+(done?'var(--ink-3)':over?'var(--crit-ink)':'var(--ink-2)')+'"'
    +' title="'+tip+'">'+(done?'':'已 ')+d+' 天'+(over?' ⚠':'')+'</span>';
}

function renderABKPI(){
  const total=abData.length;
  const tuning=abData.filter(g=>g.status==='打磨中').length;
  const finalized=abData.filter(g=>g.status==='已定版').length;
  const avgVersions=total?Math.round(abData.reduce((s,g)=>s+g.versions.length,0)/total*10)/10:0;
  const avgPolish=abAvgPolish();
  const k=(label,val)=>`<span class="stat-pill"><b>${val}</b>${label}</span>`;
  document.getElementById('ab-kpis').innerHTML=k('總遊戲數',total)+k('打磨中',tuning)+k('已定版',finalized)+k('平均打磨天數',avgPolish==null?'—':avgPolish)+k('平均版本數',avgVersions);
}

      const tip=v.label+'版 '+fmtDate(v.date)+(running?' ·測試中':'')+(v.winner?' 🏆':'');
      html+=`<span class="ab-version${v.winner?' winner':''}" style="${style}" title="${esc(tip)}">${v.label} ${fmtDate(v.date)}${v.winner?' 🏆':''}</span>`;
    });

}

function renderABTimeline(){
  const games=getFilteredAB();
  if(!games.length){document.getElementById('ab-timeline').innerHTML='';return}
  // 版本只是分類色：避開紅／綠／黃，免得 D 版看起來像「出錯」、B 版像「通過」
  const colors=['#6366f1','#0e7490','#c026d3','#0284c7','#db2777','#7c3aed','#475569','#0f766e'];
  // Compute time range
  let minD=null,maxD=null;
  games.forEach(g=>g.versions.forEach(v=>{if(v.date){if(!minD||v.date<minD)minD=v.date;if(!maxD||v.date>maxD)maxD=v.date}}));
  if(!minD){document.getElementById('ab-timeline').innerHTML='';return}
  // Extend range by 7 days each side
  const startMs=new Date(minD+'T00:00:00').getTime()-7*86400000;
  const endMs=new Date(maxD+'T00:00:00').getTime()+14*86400000;
  const range=endMs-startMs;
  function pos(d){return((new Date(d+'T00:00:00').getTime()-startMs)/range)*100}
  // Week headers
  const weeks=[];let wk=new Date(startMs);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
  while(wk.getTime()<=endMs){weeks.push(new Date(wk));wk=new Date(wk.getTime()+7*86400000)}

  let html=`<div class="gantt-today-lane"></div><div class="ab-tl-hdr"><div class="ab-tl-hlbl">遊戲</div><div class="ab-tl-wks">`;
  weeks.forEach(w=>{html+=`<div class="ab-wk">${String(w.getMonth()+1).padStart(2,'0')}/${String(w.getDate()).padStart(2,'0')}</div>`});
  html+=`</div><div class="ab-note"></div></div>`;

  games.forEach(g=>{
    // P1-4: warn when version letters skip (e.g. A, D, E) — a version was deleted or mis-numbered
    const codes=g.versions.map(v=>(v.label||'').trim().toUpperCase()).filter(l=>/^[A-Z]$/.test(l)).map(l=>l.charCodeAt(0)).sort((a,b)=>a-b);
    const missing=[];if(codes.length){for(let cc=codes[0];cc<=codes[codes.length-1];cc++){if(!codes.includes(cc))missing.push(String.fromCharCode(cc))}}
    const gapHtml=missing.length?`<span class="ab-gap" title="版本字母不連續，缺 ${missing.join('、')}：可能刪過版本或輸入跳號">⚠ 缺 ${missing.join(',')}</span>`:'';
    html+=`<div class="ab-timeline-row"><div class="ab-timeline-lbl" title="${esc(g.gameName)}${missing.length?'（版本字母不連續，缺 '+missing.join('、')+'）':''}"><span class="ab-tl-name">${esc(g.gameName)}</span>${gapHtml}</div><div class="ab-timeline-bar">`;
    // Connection line
    const dates=g.versions.filter(v=>v.date).map(v=>v.date).sort();
    if(dates.length>1){const l=pos(dates[0]),r=pos(dates[dates.length-1]);html+=`<div class="ab-connect" style="left:${l}%;width:${r-l}%"></div>`}
    const wv=abWinner(g);
    // Dots
    // P1-4: dots closer than 3% of the axis alternate between two lanes so same-day versions stay visible
    const placed=g.versions.map((v,vi)=>({v,vi,p:v.date?pos(v.date):null})).filter(x=>x.p!==null).sort((a,b)=>a.p-b.p);
    let lastP=-Infinity,lastLane=0;
    placed.forEach(x=>{x.lane=(x.p-lastP<3)?(lastLane===0?1:0):0;lastP=x.p;lastLane=x.lane});
    placed.forEach(({v,vi,p,lane})=>{
      const c=colors[vi%colors.length];
      html+=`<div class="ab-dot${v.winner?' winner':''}${lane?' lane1':''}${v.running?' cmp':''}" tabindex="0" role="img" aria-label="${esc(v.label)}版 ${fmtDate(v.date)}${v.winner?'，勝出':''}${v.running?'，本次比較':''}" style="left:${p}%;background:${dotBg(c)}"><div class="ab-dot-tip">${v.label}版 ${fmtDate(v.date)}${v.winner?' 🏆':''}${v.running?' ·本次比較':''}</div>${v.label}</div>`;
    });
    const pd=abPolishDays(g),pOver=!wv&&abAvgPolish()!=null&&pd!=null&&pd>abAvgPolish();
    html+=`</div><div class="ab-note" style="color:${wv?'var(--ink-3)':pOver?'var(--crit-ink)':'var(--ink-2)'}">${pd==null?'':(wv?'定版 '+pd+' 天':'打磨中 '+pd+' 天'+(pOver?' ⚠':''))}</div></div>`;
  });

  // Today line
  const todayPos=pos(TODAY);
  if(todayPos>0&&todayPos<100){html+=`<div style="position:absolute;top:17px;bottom:0;left:calc(var(--ab-lbl-w) + (100% - var(--ab-lbl-w) - var(--ab-note-w))*${todayPos}/100);width:2px;background:var(--crit-mark);opacity:.7;z-index:10;pointer-events:none"><div class="today-label">今天</div></div>`}
  const tl=document.getElementById('ab-timeline');
  // 每週至少 44px，窄螢幕改成左右捲動（跟甘特圖一樣），日期標籤不會被擠掉
  tl.style.setProperty('--ab-wks',weeks.length);
  tl.innerHTML=`<div style="position:relative">${html}</div>`;
  const lane=tl.querySelector('.gantt-today-lane'),wrapEl=tl.parentElement;
  if(lane)lane.textContent=(wrapEl&&wrapEl.scrollWidth>wrapEl.clientWidth+1)?'↔ 左右捲動可看完整時間軸':'';
}

  const g=getFilteredAB()[gi];
  const lbl=document.getElementById('abv-label').value||'?';
  const dt=document.getElementById('abv-date').value;
  g.versions.push({label:lbl,date:dt,winner:false});

    <label style="font-size:11px;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:3px;width:34px;justify-content:center" title="AB 測試中（可複選）"><input type="checkbox" class="abv-run" ${v.running?'checked':''}>測</label>

    <div class="fg"><label>上線日期</label><input type="date" id="abe-launch" value="${g.launchDate}"></div>
    <div class="fg"><label>外部連結</label><input id="abe-link" value="${esc(g.link||'')}" placeholder="https://...（打磨細部資訊）"></div>

    <div id="abe-versions">${versionsHtml}</div>
    <div class="modal-btns"><button class="btn btn-cancel" data-action="closeModal">取消</button><button class="btn btn-primary" data-action="submitEditABGame" data-gi="${gi}">儲存</button></div>`);
}
async function submitEditABGame(gi){
  const g=getFilteredAB()[gi];
  g.gameName=document.getElementById('abe-name').value;
  g.gameTag=document.getElementById('abe-tag').value;
  g.targetMarket=document.getElementById('abe-market').value;
  g.launchDate=document.getElementById('abe-launch').value;
  g.link=document.getElementById('abe-link').value;
  g.status=document.getElementById('abe-status').value;
  const vEls=document.querySelectorAll('#abe-versions .abv-row');
  g.versions=[];
  vEls.forEach((el,i)=>{
    const lbl=el.querySelector('.abv-lbl');
    const dt=el.querySelector('.abv-dt');
    const run=el.querySelector('.abv-run');
    const win=el.querySelector('.abv-winner');
    if(lbl&&dt)g.versions.push({label:lbl.value,date:dt.value,winner:win?win.checked:false,running:run?run.checked:false});
  });
  closeModal();renderAB();await saveABData();
}
async function delABGame(gi){
  const g=getFilteredAB()[gi];
  if(!await confirmDialog('確定刪除「'+g.gameName+'」？這會刪掉它的所有版本。'))return;
  const idx=abData.indexOf(g);if(idx>=0)abData.splice(idx,1);
  renderAB();await apiPost({action:'deleteABGame',game:g.gameName});
}

async function saveABData(){
  if(canEdit()){
    try{await apiPost({action:'writeAB',data:abData})}catch(e){}
  }
}
